<!DOCTYPE html>
<html>

<head>
    <title>Phishing Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<form method="POST">

    <h2>🎣 Advanced Phishing Detection System</h2>

    <textarea name="text" placeholder="Enter URL or Email"></textarea>

    <button type="submit">Analyze Threat</button>

    {% if result %}
    <div class="result">

        <h3>Analysis Result</h3>

        <pre>{{ result }}</pre>

        <a href="/download">
            <button type="button">Download Report</button>
        </a>

    </div>
    {% endif %}

</form>

</body>
</html>
